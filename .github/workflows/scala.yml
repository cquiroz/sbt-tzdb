name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 2.12 builds the sbt 1.x plugin, Scala 3 the sbt 2.x one.
        scala: [2.12.21, 3.8.4]

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Checking your code format
        run: sbt scalafmtCheckAll
      - name: Run tests
        run: sbt "++${{ matrix.scala }}" clean sbt-tzdb/scripted
